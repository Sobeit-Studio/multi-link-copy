<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-Link Copy</title>
<style>
  /* Tokens. Light values are the design's; dark values map to Figma's theme variables. */
  :root {
    --surface: #ffffff;
    --text: #1e1e1e;
    --text-muted: #737373;
    --text-placeholder: #b3b3b3;
    --border: #d9d9d9;
    --divider: #e6e6e6;
    --primary: #2c2c2c;
    --primary-border: #2c2c2c;
    --on-primary: #f5f5f5;
    --disabled: #d9d9d9;
    --disabled-border: #b3b3b3;
    --on-disabled: #b3b3b3;
    --danger: #ec221f;
    --danger-border: #900b09;
    --on-danger: #f5f5f5;
    --error-text: #dc2626;
    --focus: var(--figma-color-border-selected, #0d99ff);
  }

  .figma-dark {
    --surface: var(--figma-color-bg);
    --text: var(--figma-color-text);
    --text-muted: var(--figma-color-text-secondary);
    --text-placeholder: var(--figma-color-text-tertiary);
    --border: var(--figma-color-border);
    --divider: var(--figma-color-border);
    --primary: var(--figma-color-bg-inverse);
    --primary-border: var(--figma-color-bg-inverse);
    --on-primary: var(--figma-color-text-oninverse);
    --disabled: var(--figma-color-bg-disabled);
    --disabled-border: var(--figma-color-border-disabled);
    --on-disabled: var(--figma-color-text-disabled);
    --danger: var(--figma-color-bg-danger);
    --danger-border: var(--figma-color-bg-danger);
    --on-danger: var(--figma-color-text-ondanger);
    --error-text: var(--figma-color-text-danger);
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; }

  body {
    overflow: hidden;
    background: var(--surface);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button, input { font: inherit; color: inherit; margin: 0; }

  p { margin: 0; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .icon { display: block; flex-shrink: 0; }

  /* Layout */
  .pad { padding: 16px 20px; }

  .stack { display: flex; flex-direction: column; gap: 12px; }

  .center { display: flex; justify-content: center; }

  .row { display: flex; gap: 12px; }
  .row-top { align-items: flex-start; }
  .row-middle { align-items: center; }
  .row-bottom { align-items: flex-end; }

  .field { display: flex; flex: 1 1 0; flex-direction: column; gap: 8px; min-width: 120px; }

  .desc { font-size: 12px; line-height: 16px; color: var(--text-muted); }

  .label { display: block; font-size: 16px; line-height: 1.4; color: var(--text); }

  .error { font-size: 16px; line-height: 1.4; color: var(--error-text); }

  /* Controls. Figma draws the 1px stroke inside the box, so 11px padding + 1px border
     puts the text 12px (inputs: 16px) from the outer edge and keeps controls 40px tall. */
  .input {
    display: block;
    width: 100%;
    min-width: 120px;
    height: 40px;
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    line-height: 1;
    text-overflow: ellipsis;
    -webkit-appearance: none;
    appearance: none;
  }
  .input::placeholder { color: var(--text-placeholder); opacity: 1; }

  .btn {
    display: inline-flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px;
    border: 1px solid var(--primary-border);
    border-radius: 8px;
    background: var(--primary);
    color: var(--on-primary);
    font-size: 16px;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn:disabled {
    border-color: var(--disabled-border);
    background: var(--disabled);
    color: var(--on-disabled);
    cursor: default;
  }
  .btn-danger {
    border-color: var(--danger-border);
    background: var(--danger);
    color: var(--on-danger);
  }

  .icon-btn {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  /* Settings back bar: 8px + 20px line + 7px + 1px divider = 36px, as in the design. */
  .back {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    padding: 8px 16px 7px;
    border: 0;
    border-bottom: 1px solid var(--divider);
    border-radius: 0;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    line-height: 20px;
    text-align: left;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .back:focus-visible { outline-offset: -2px; }
  .back .icon { color: var(--text-muted); }
</style>
</head>
<body>
<section class="pad stack" data-screen="add-url" hidden>
  <p class="desc" id="add-desc">Add this file’s URL to copy multiple links at once.</p>
  <form class="row row-top" id="add-form" novalidate autocomplete="off">
    <div class="field">
      <input class="input" id="url-input" type="url" placeholder="Paste this file’s URL..." aria-label="File URL" aria-describedby="add-desc" spellcheck="false" autocapitalize="off">
      <p class="error" id="url-error" role="alert" hidden>Please enter a valid URL</p>
    </div>
    <button class="btn" id="continue-btn" type="submit" disabled>Continue</button>
  </form>
</section>

<section class="pad center" data-screen="copy" hidden>
  <div class="row row-middle">
    <button class="btn" id="copy-btn" type="button"><span class="icon" aria-hidden="true"><svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Copy">
<g id="Vector">
</g>
<path id="Vector_2" d="M10.5 10.5H13.5V2.5H5.5V5.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/>
<path id="Vector_3" d="M2.5 5.5H10.5V13.5H2.5V5.5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/>
</g>
</svg>
</span>Copy Links</button>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings"><span class="icon" aria-hidden="true"><svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="GearSix">
<g id="Vector">
</g>
<path id="Vector_2" d="M13.125 10C13.125 11.7259 11.7259 13.125 10 13.125C8.27411 13.125 6.875 11.7259 6.875 10C6.875 8.27411 8.27411 6.875 10 6.875C11.7259 6.875 13.125 8.27411 13.125 10Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/>
<path id="Vector_3" d="M10.1602 16.1023C10.0555 16.1023 9.95 16.1023 9.84766 16.1023L7.34375 17.5C6.369 17.1721 5.4649 16.6632 4.67891 16L4.66953 13.1875C4.61406 13.1 4.56172 13.0117 4.51328 12.9211L2.02344 11.5031C1.82732 10.5112 1.82732 9.4904 2.02344 8.49844L4.51094 7.08438C4.56172 6.99453 4.61406 6.90547 4.66719 6.81797L4.67969 4.00547C5.46497 3.34035 6.36884 2.82957 7.34375 2.5L9.84375 3.89766C9.94844 3.89766 10.0539 3.89766 10.1562 3.89766L12.6563 2.5C13.631 2.82788 14.5351 3.33679 15.3211 4L15.3305 6.8125C15.3859 6.9 15.4383 6.98828 15.4867 7.07891L17.975 8.49609C18.1711 9.48806 18.1711 10.5088 17.975 11.5008L15.4875 12.9148C15.4367 13.0047 15.3844 13.0938 15.3313 13.1813L15.3188 15.9938C14.534 16.659 13.6307 17.17 12.6563 17.5L10.1602 16.1023Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/>
</g>
</svg>
</span></button>
  </div>
</section>

<section data-screen="settings" hidden>
  <button class="back" id="back-btn" type="button"><span class="icon" aria-hidden="true"><svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon / chevron-left">
<path id="Vector" d="M8.44067 3.19067C8.61153 3.01982 8.88847 3.01982 9.05933 3.19067C9.23018 3.36153 9.23018 3.63847 9.05933 3.80933L5.86865 7L9.05933 10.1907C9.23018 10.3615 9.23018 10.6385 9.05933 10.8093C8.88847 10.9802 8.61153 10.9802 8.44067 10.8093L4.94067 7.30933C4.76982 7.13847 4.76982 6.86153 4.94067 6.69067L8.44067 3.19067Z" fill="currentColor"/>
</g>
</svg>
</span>Settings</button>
  <div class="pad">
    <div class="row row-bottom">
      <div class="field">
        <label class="label" for="file-url">File URL</label>
        <input class="input" id="file-url" type="text" readonly>
      </div>
      <button class="btn btn-danger" id="delete-btn" type="button">Delete</button>
    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  const sections = {};
  document.querySelectorAll('section[data-screen]').forEach((el) => {
    sections[el.dataset.screen] = el;
  });

  const form = document.getElementById('add-form');
  const urlInput = document.getElementById('url-input');
  const urlError = document.getElementById('url-error');
  const continueBtn = document.getElementById('continue-btn');
  const copyBtn = document.getElementById('copy-btn');
  const settingsBtn = document.getElementById('settings-btn');
  const backBtn = document.getElementById('back-btn');
  const fileUrlInput = document.getElementById('file-url');
  const deleteBtn = document.getElementById('delete-btn');

  let current = null;
  let lastHeight = -1;

  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

  // Height of the visible section, so the plugin window fits it with no scrollbar.
  function reportHeight(onlyIfChanged) {
    if (!current) return;
    const height = Math.ceil(current.getBoundingClientRect().height);
    if (onlyIfChanged && height === lastHeight) return;
    lastHeight = height;
    post({ type: 'resize', height });
  }

  function syncContinue() {
    continueBtn.disabled = urlInput.value.trim() === '';
  }

  // Returns true when the error's visibility actually changed.
  function setError(visible) {
    if (urlError.hidden === !visible) return false;
    urlError.hidden = !visible;
    if (visible) urlInput.setAttribute('aria-invalid', 'true');
    else urlInput.removeAttribute('aria-invalid');
    return true;
  }

  function show(screen, fileUrl) {
    const target = sections[screen];
    if (!target) return;
    const previous = current;
    const hadFocus = !!previous && previous !== target && previous.contains(document.activeElement);

    Object.keys(sections).forEach((name) => {
      sections[name].hidden = sections[name] !== target;
    });
    current = target;

    if (screen === 'add-url') {
      urlInput.value = '';
      setError(false);
      syncContinue();
      urlInput.focus();
    } else if (screen === 'settings') {
      fileUrlInput.value = typeof fileUrl === 'string' ? fileUrl : '';
      fileUrlInput.scrollLeft = 0;
      if (hadFocus) backBtn.focus();
    } else if (hadFocus) {
      (previous === sections.settings ? settingsBtn : copyBtn).focus();
    }

    reportHeight(false);
  }

  function showUrlInvalid() {
    const changed = setError(true);
    urlInput.focus();
    if (changed && current === sections['add-url']) reportHeight(false);
  }

  function writeClipboard(text, count) {
    const previous = document.activeElement;
    const ta = document.createElement('textarea');
    ta.value = text == null ? '' : String(text);
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    document.body.removeChild(ta);
    if (previous && previous !== document.body && typeof previous.focus === 'function') {
      previous.focus();
    }
    post({ type: 'copy-result', ok, count });
  }

  urlInput.addEventListener('input', () => {
    syncContinue();
    if (setError(false)) reportHeight(false);
  });

  // Covers both the Continue click and Enter in the input. Enter does nothing while
  // Continue is disabled, because implicit submission skips a disabled default button.
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const url = urlInput.value.trim();
    if (url) post({ type: 'save-url', url });
  });

  copyBtn.addEventListener('click', () => post({ type: 'copy' }));
  settingsBtn.addEventListener('click', () => post({ type: 'open-settings' }));
  backBtn.addEventListener('click', () => post({ type: 'close-settings' }));
  deleteBtn.addEventListener('click', () => post({ type: 'delete-url' }));

  // A width change can rewrap text; report only if the height really changed.
  window.addEventListener('resize', () => reportHeight(true));

  window.onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== 'object') return;
    switch (msg.type) {
      case 'show':
        show(msg.screen, msg.fileUrl);
        break;
      case 'url-invalid':
        showUrlInvalid();
        break;
      case 'write-clipboard':
        writeClipboard(msg.text, msg.count);
        break;
      default:
        break;
    }
  };

  post({ type: 'ready' });
})();
</script>
</body>
</html>
